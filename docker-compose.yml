services:
  app:
    image: ghcr.io/${GHCR_USER}/todo-api:${APP_VERSION}
    restart: unless-stopped
    environment:
      - DATABASE_URL=/var/lib/todo-api/todos.db
      - JWT_SECRET=${JWT_SECRET}
    volumes:
      - todo-data:/var/lib/todo-api
    networks:
      - todo-net
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 3000 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    user: root

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app
    networks:
      - todo-net

networks:
  todo-net:
    driver: bridge

volumes:
  todo-data: